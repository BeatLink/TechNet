<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <style>
            :root { color-scheme: light dark; }
            body { font: 13px system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
            header { padding: 0.5em 0.75em; border-bottom: 1px solid rgba(128,128,128,0.3); display: flex; gap: 0.5em; align-items: baseline; }
            header b { font-size: 13px; }
            #model { color: #888; font-size: 11px; margin-left: auto; }
            #log { flex: 1; overflow-y: auto; padding: 0.75em; }
            .msg { margin-bottom: 0.75em; white-space: pre-wrap; overflow-wrap: anywhere; }
            .you { font-weight: 600; }
            .tool { color: #888; font-size: 11px; font-family: monospace; white-space: pre-wrap; }
            .bad { color: #b00; }
            #confirm { padding: 0.5em 0.75em; border-top: 1px solid rgba(128,128,128,0.3); display: none; }
            #confirm.show { display: block; }
            #confirm p { margin: 0 0 0.5em; }
            footer { padding: 0.5em 0.75em; border-top: 1px solid rgba(128,128,128,0.3); }
            textarea { width: 100%; box-sizing: border-box; resize: vertical; min-height: 3.2em; font: inherit; }
            button { padding: 0.35em 0.8em; }
            #send { width: 100%; margin-top: 0.4em; }
            #send:disabled { opacity: 0.5; }
        </style>
    </head>
    <body>
        <header>
            <b>Bookmarks</b>
            <span id="model">connecting…</span>
        </header>
        <div id="log"></div>
        <div id="confirm">
            <p id="confirm-text"></p>
            <button id="yes">Do it</button>
            <button id="no">Cancel</button>
        </div>
        <footer>
            <textarea id="input" placeholder="e.g. what's still loose? &#10;move the gaming links into Fun"></textarea>
            <button id="send">Send</button>
        </footer>
        <script src="tools.js"></script>
        <script src="sidebar.js"></script>
    </body>
</html>
