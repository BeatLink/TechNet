name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # A started run on main finishes: main moves more often than Odin's build takes

jobs:
  hosts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: List every host and its platform
        id: list
        run: |
          echo "matrix=$(nix eval --json .#checks --apply 'checks: builtins.concatMap (system: map (host: {
            inherit host system;
            runner = if system == "aarch64-linux" then "ubuntu-24.04-arm" else "ubuntu-latest";
          }) (builtins.attrNames checks.${system})) (builtins.attrNames checks)')" >> "$GITHUB_OUTPUT"

  # Each host is evaluated on a runner of its own platform, since Thor's evaluation reads a file out of an aarch64 source (nix/5-phone/1-system/gnss.nix)
  build:
    needs: hosts
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.hosts.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # A host's closure is tens of GiB unpacked, more than a stock runner has free
      - uses: wimpysworld/nothing-but-nix@v12
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://claude-code.cachix.org
            extra-trusted-public-keys = claude-code.cachix.org-1:YeXf2aNu7UTX8Vwrze0za1WEDS+4DuI2kVeWEE4fsRk=
      - name: Evaluate ${{ matrix.host }}
        run: nix eval --raw ".#checks.${{ matrix.system }}.${{ matrix.host }}.drvPath"
      - name: Build ${{ matrix.host }}
        run: nix build --keep-going --no-link ".#checks.${{ matrix.system }}.${{ matrix.host }}"
